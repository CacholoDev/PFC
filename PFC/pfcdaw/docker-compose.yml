# Version
version: "3.9"
 
# servicios (contenedores)
services:
  # ===== SERVICIO 1: BD MySQL =====
  mysql:
    container_name: mysql           # Nombre
    image: mysql:8.0                # Imaxe de MySQL 8.0
    ports:       #acordarse comentar esto para produccion mais o puerto
      - "3306:3306"                 # 3306 sale po host (PC local)
    command:                        # Configuracionn o arrancar MySQL
      - --default-authentication-plugin=mysql_native_password  # autenticacion
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
    environment:                    # Variables de entorno para configurar MySQL
      - MYSQL_ROOT_PASSWORD=${DB_PASSROOT}    # Contraseña do user root
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=panaderiaPFC # Crea a BD + permisos a 'admin'
      - DOCKER_TIMEZONE=Europe/Madrid
    volumes:                        # Persistencia de datos
      - mysql_panaderia:/var/lib/mysql              # persistencia
      - '/etc/timezone:/etc/timezone:ro'            # Sincroniza zona horaria (read-only)
      - '/etc/localtime:/etc/localtime:ro'          # Sincroniza hora do sistema
#    restart: always                                # si queremos datos novos
    healthcheck:                    # Verifica que MySQL ta listo antes de arrancar backend
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-padmin123"]
      timeout: 20s                  # Tempo de espera por resposta
      retries: 10                   # intentos
      start_period: 30s             # tempo antes de empezar a comprobar
 
  # ===== SERVICIO 2: BACKEND SpringBoot =====
  backend:
    build: .                        # Construe imaxe usando Dockerfile neste directorio
    container_name: backend         # Nombre
#    restart: always                # reinicia automáticamente
    #ports:                         # Mapea puertos porque asi non poden acceder o 8080
    #  - "8080:8080"                 # puerto 8080 o host
    environment:                    # Sobreescribe variables de application.properties
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update       # Actualiza esquema de BD automáticamente
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - SPRING_PROFILES_ACTIVE=docker              # Activa perfil 'docker' de Spring
      - SERVER_PORT=8080
      - APP_UPLOAD_DIR=/app/static/images/        # variable entorno docker + directorio para subir imaxes 
      
    depends_on:                     # Non arranca hasta que MySQL este listo
      mysql:
        condition: service_healthy      # Espera polo healthcheck de MySQL a q sea OK
    volumes:
      #- ./static/images:/app/static/images  # Mapeo carpeta para subir imaxes
      - ./src/main/resources/static/assets/images/uploads:/app/static/images/uploads # Volumen compartido co front para as imaxes subidas
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'

  # ===== SERVICIO 3: PROXY Nginx =====
  nginx:
    container_name: nginx           # Nombre
    build: 
      context: .                    # Carpeta donde buscar archivos
      dockerfile: Dockerfile.nginx  # Usa este Dockerfile para construir a imaxe
    ports:
      - "8081:80"                   # Puerto 8081 do host → puerto 80 del contenedor
    depends_on:                     # Non arranca hasta que backend este listo
      - backend
    tty: true                       # sigue ca terminal aberta
#    restart: always                # reinicia automáticamente
    volumes:                        # Sincroniza zona horaria co host
      - '/etc/timezone:/etc/timezone:ro'    # Sincroniza zona horaria
      - '/etc/localtime:/etc/localtime:ro'  # Sincroniza hora do sistema
      #- ./static:/usr/share/nginx/html/static #
      - ./src/main/resources/static:/usr/share/nginx/html # Monta os statics e subidas na raiz de Nginx
 
# volumes (persistencia de datos)
volumes:
  mysql_panaderia:                  # Volumen para datos de MySQL (persiste entre reinicios)
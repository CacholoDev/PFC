
# Nombre
spring.application.name=pfcdaw


# CONFIGURACIÓN  SERVIDOR
server.port=${SERVER_PORT:8080}


# CONFIGURACIÓN DE BASE DE DATOS //
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/panaderiaPFC?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
#spring.datasource.url=jdbc:mysql://mysql:3306/panaderiaPFC?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
#spring.datasource.username=admin
#spring.datasource.password=admin123

# Driver de MySQL 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE JPA/HIBERNATE
# Mostrar as consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Crea a Bd si nn existe, si existe actualiza a base de datos 
spring.jpa.hibernate.ddl-auto=update
# Dialecto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SCRIPT DATOS BD
# Executar data.sql DESPOIS de que Hibernate cree as tablas
spring.jpa.defer-datasource-initialization=true
# Modo de inicialización (always = sempre executa data.sql)
spring.sql.init.mode=always


# CONFIGURACIÓN DE LOGGING
# logging para ver que ta pasando
logging.level.com.pfcdaw=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss} - %logger{36} - %msg%n


# UPLOADs de imaxes
# CONFIGURACIÓN DE MULTIPART (subida de ficheiros)
# Tamaño max.
spring.servlet.multipart.max-file-size=7MB  
# Tamaño max. total da petición  
spring.servlet.multipart.max-request-size=7MB 

# Para desarrollo local
#app.upload.dir=src/main/resources/static/assets/images/
#probar app.upload.dir=./src/main/resources/static/assets/images/
app.upload.dir=C:/Users/Usuario/PFC/PFC/pfcdaw/src/main/resources/static/assets/images/


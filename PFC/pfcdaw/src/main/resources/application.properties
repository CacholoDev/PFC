
# Nombre
spring.application.name=pfcdaw


# CONFIGURACIÓN  SERVIDOR
server.port=${SERVER_PORT:8080}


# CONFIGURACIÓN DE BASE DE DATOS
# 3 primeiras local(usar sempre estas porque colle as variable de entorno si as hay e si nn tira do localhost) - 3 ultimas docker
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/panaderiaPFC?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
#spring.datasource.url=jdbc:mysql://mysql:3306/panaderiaPFC?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
#spring.datasource.username=admin
#spring.datasource.password=admin123

# Driver de MySQL 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE JPA/HIBERNATE
# Mostrar as consultas SQL en consola
spring.jpa.show-sql=false
# Formatear as consultas SQL en consola
spring.jpa.properties.hibernate.format_sql=true
# Crea a Bd si nn existe, si existe actualiza a base de datos 
spring.jpa.hibernate.ddl-auto=update
# Dialecto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SCRIPT DATOS BD
# Executar data.sql DESPOIS de que Hibernate cree as tablas
spring.jpa.defer-datasource-initialization=true
# Modo de inicialización (always = sempre executa data.sql)
spring.sql.init.mode=always


# CONFIGURACIÓN DE LOGGING
# logging para ver que ta pasando
logging.level.com.pfcdaw=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss} - %logger{36} - %msg%n


# UPLOADs de imaxes
# CONFIGURACIÓN DE MULTIPART (subida de ficheiros)
# Tamaño máximo de archivo individual (5MB por seguridad)
spring.servlet.multipart.max-file-size=5MB  
# Tamaño máximo total de la petición (5MB)
spring.servlet.multipart.max-request-size=5MB 
# Habilitar subida de archivos
spring.servlet.multipart.enabled=true 

# Para local
#app.upload.dir=C:/Users/Usuario/PFC/PFC/pfcdaw/src/main/resources/static/assets/images/
## con variable de entorno
app.upload.dir=${APP_UPLOAD_DIR:C:/Users/Usuario/PFC/PFC/pfcdaw/src/main/resources/static/assets/images/}
# Para Docker   
#app.upload.dir=/app/static/images/    

# Tempo de vida da session en segundos para cando usemos springSecurity (2 horas = 7200 segundos)
#server.servlet.session.timeout=10
# Cookie de sesión
#server.servlet.session.cookie.max-age=10
#server.servlet.session.cookie.http-only=true

# CONFIGURACIÓN JWT (Spring Security)
# IMPORTANTE: La clave secreta DEBE tener al mínimo 64 caracteres para HMAC-SHA512 (512 bits)
# El valor por defecto es para desarrollo local, en Docker se usa el .env
app.jwt.secret=${JWT_SECRET:misuperclavesecrertadevparahmacsha512masdeloscincuentacaracteresnecesariosminimo1234567890}
app.jwt.expiration=${JWT_EXPIRATION:6600000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CONFIGURACIÓN ACTUATOR (Monitorización)
# Exponer solo el endpoint de health (por seguridad)
management.endpoints.web.exposure.include=health
# Base path para Actuator (por defecto /actuator)
management.endpoints.web.base-path=/actuator
# Mostrar detalles del health check (always = siempre, when-authorized = solo con token admin, never = nunca)
management.endpoint.health.show-details=when-authorized
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Panadería PFC</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/stylesLogin.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

</head>

<body>
    <!-- Contenedor principal centrado -->
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <!-- Card login -->
                <div class="card shadow-lg">
                    <div class="card-body p-5">

                        <!-- Logo/Título -->
                        <div class="text-center mb-4">
                            <i class="bi bi-shop fs-1 text-warning"></i>
                            <h2 class="card-title mt-2">Panadería PFC</h2>
                            <p class="text-muted">Inicia sesión para continuar</p>
                        </div>

                        <!-- Alerta do erro (oculta por defecto) -->
                        <div id="alertError" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span id="errorMessage"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Formulario login -->
                        <form id="loginForm">

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="bi bi-envelope-fill me-1"></i>
                                    Correo electrónico
                                </label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="ejemplo@gmail.com" required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock-fill me-1"></i>
                                    Contraseña
                                </label>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="••••••••" required>
                            </div>

                            <!-- Button do login -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-warning btn-lg" id="btnLogin">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>
                                    Iniciar sesión
                                </button>
                            </div>
                        </form>

                        <!-- button registrarse-->
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-outline-secondary text-dark btn-lg" id="btnRegister">
                                <i class="bi bi-person-plus-fill me-2"></i>
                                Registrarse
                            </button>
                        </div>

                        <!-- credenciales de proba  -->
                        <div class="mt-4 p-3 bg-light rounded">
                            <small class="text-muted">
                                <strong>Credenciales de prueba:</strong><br>
                                <i class="bi bi-person-badge"></i> Admin: admin@panaderia.com / admin123/ñ<br>
                                <i class="bi bi-person"></i> User: forza.Depor@example.com / user123/ñ
                            </small>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- modal Registrarse -->
    <div class="modal fade" id="modalRegister" tabindex="-1" aria-labelledby="modalRegisterLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalRegisterLabel">
                        <i class="bi bi-person-plus-fill me-2"></i>
                        Registrarse
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">

                        <div class="mb-3">
                            <label for="nombreUser" class="form-label">
                                <i class="bi bi-person-fill text-warning me-1"></i>
                                Nombre</label>
                            <input type="text" class="form-control" id="nombreUser" name="nombreUser" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellidoUser" class="form-label">
                                <i class="bi bi-person-fill text-warning me-1"></i>
                                Apellido</label>
                            <input type="text" class="form-control" id="apellidoUser" name="apellidoUser" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailUser" class="form-label">
                                <i class="bi bi-envelope-fill text-warning me-1"></i>
                                Correo electrónico
                            </label>
                            <input type="email" class="form-control" id="emailUser" name="emailUser"
                                placeholder="Correo electrónico" required>
                        </div>
                        <div class="mb-3">
                            <label for="telefonoUser" class="form-label">
                                <i class="bi bi-telephone-fill text-warning me-1"></i>
                                Teléfono</label>
                            <input type="text" class="form-control" id="telefonoUser" name="telefonoUser" required>
                        </div>
                        <div class="mb-3">
                            <label for="direccionUser" class="form-label">
                                <i class="bi bi-geo-alt-fill text-warning me-1"></i>
                                Dirección</label>
                            <input type="text" class="form-control" id="direccionUser" name="direccionUser" required>
                        </div>
                        <div class="mb-3">
                            <label for="nombreEmpresaUser" class="form-label">
                                <i class="bi bi-building text-warning me-1"></i>
                                Nombre de la Empresa</label>
                            <input type="text" class="form-control" id="nombreEmpresaUser" name="nombreEmpresaUser"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="passwordUser" class="form-label">
                                <i class="bi bi-lock-fill text-warning me-1"></i>
                                Contraseña
                            </label>
                            <input type="password" class="form-control" id="passwordUser" name="passwordUser"
                                placeholder="Contraseña" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPasswordUser" class="form-label">
                                <i class="bi bi-lock-fill text-warning me-1"></i>
                                Confirmar Contraseña
                            </label>
                            <input type="password" class="form-control" id="confirmPasswordUser"
                                name="confirmPasswordUser" placeholder="Confirmar Contraseña" required>
                        </div>
                        <div class="mb-3">
                            <label for="roleUser" class="form-label">
                                <i class="bi bi-person-badge-fill text-warning me-1"></i>
                                Rol: <i>(Usuario por defecto)</i></label>
                            <select class="form-select" id="roleUser" name="roleUser" disabled required>
                                <option value="USER" selected>Usuario</option>
                            </select>
                        </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnRegistro">Registrar</button>
                </div>
                </form>
            </div>
        </div>
    </div>



    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- JS -->
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>

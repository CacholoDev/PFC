# ===== DATABASE (TEST) =====
spring.datasource.url=jdbc:mysql://localhost:3306/pfcdaw
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA/HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== JWT =====
app.jwt.secret=your-secret-key-min-64-characters-for-hmac-sha512-algorithm-here123456789
app.jwt.expiration=6600000
app.jwt.refresh-expiration=604800000

# ===== RATE LIMITING =====
app.rate-limit.max-attempts=5
app.rate-limit.time-window-minutes=15

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.pfcdaw=DEBUG

# ===== MULTIPART =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

server {
    listen 8221;
    server_name localhost;

    # Resolver de Docker (ESENCIAL para resolver nombres de servicios)
    resolver 127.0.0.11 valid=10s;

    location /dir_contenidos/ {
        root /;
        expires 1h;
        autoindex off;
    }

    # Servir archivos estáticos (imágenes, CSS, JS)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Usar variable para forzar resolución DNS en tiempo de ejecución
        set $backend servidor_contenidos_fastapi:8220;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para evitar que falle
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Página 404 personalizada
    error_page 404 /404.html;

    # Asegurar que la página 404 sea accesible
    location = /404.html {
        internal;
        root /usr/share/nginx/error_pages;
    }
}
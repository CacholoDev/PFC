# ===== CONFIGURACIÓN DE NGINX =====
# Define un grupo de servidores backend (balance de carga si hubiera varios)
upstream backend {
    server backend:8080;            # Nombre del servicio en docker-compose:puerto
}
 
server {
    # Escucha en puerto 80 DENTRO del contenedor
    # Docker mapea 8081 (host) → 80 (contenedor) en docker-compose.yml
    listen 80;
    server_name localhost;
 
    # Configuración para redirecciones correctas con puerto
    port_in_redirect on;            # Incluye puerto en URLs de redirección
    absolute_redirect off;          # Usa redirecciones relativas (no absolutas)
 
    # ===== UBICACIÓN PRINCIPAL: PROXY AL BACKEND =====
    location / {
        # Reenvía todas las peticiones al backend de Spring Boot
        proxy_pass http://backend;
        
        # Headers que el backend necesita para saber el origen real de la petición
        proxy_set_header Host $http_host;                      # Host + puerto (localhost:8081)
        proxy_set_header X-Real-IP $remote_addr;               # IP real del cliente
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Cadena de IPs (si hay varios proxies)
        proxy_set_header X-Forwarded-Proto $scheme;            # Protocolo (http/https)
        proxy_set_header X-Forwarded-Host $host;               # Host original
        proxy_set_header X-Forwarded-Port 8081;                # Puerto original
        
        # Timeouts para conexiones al backend
        proxy_connect_timeout 30s;  # Tiempo máximo para conectar
        proxy_send_timeout 90s;     # Tiempo máximo para enviar datos
        proxy_read_timeout 90s;     # Tiempo máximo para recibir respuesta
    }
 
    # ===== UBICACIÓN SECUNDARIA: ARCHIVOS ESTÁTICOS =====
    # (Opcional) Sirve assets directamente desde Nginx sin pasar por backend
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;                 # Cachea durante 1 año
        add_header Cache-Control "public, immutable";  # No cambian nunca
    }
}
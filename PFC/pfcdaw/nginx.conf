# ===== CONFIGURACIÓN DE NGINX =====
# Define un grupo de servidores backend (balance de carga si hubera varios)
upstream backend {
    server backend:8080;            # Nombre do servicio no docker-compose:puerto
}
 
server {
    # Escoita no puerto 80 DENTRO do contenedor
    # Docker mapea 8081 (host) → 80 (contenedor) en docker-compose.yml
    listen 80;
    server_name localhost;
 
    # Configuración para redireccions correctas con puerto
    port_in_redirect on;            # Inclue puerto en URLs de redirección
    absolute_redirect off;          # Usa redirecciones relativas (non absolutas)

    # Página de error personalizada para 404 + 500s
    error_page 404 = /error_pages/404.html; # Paxina personalizada para 404
    error_page 500 502 503 504 = /error_pages/50x.html; # Paxina personalizada para erros 500s
 
    # ===== UBICACIÓN PRINCIPAL: PROXY to BACKEND =====
    location / {
        # Reenvía todas as peticiones po backend de Spring Boot
        proxy_pass http://backend;
        
        # Headers que o backend necesita para saber o orixe real da petición
        proxy_set_header Host $http_host;                      # Host + puerto (localhost:8081)
        proxy_set_header X-Real-IP $remote_addr;               # IP real do cliente
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Cadea de IPs (se hai varios proxys)
        proxy_set_header X-Forwarded-Proto $scheme;            # Protocolo (http/https)
        proxy_set_header X-Forwarded-Host $host;               # Host orixinal
        proxy_set_header X-Forwarded-Port 8081;                # Puerto orixinal
        
        # Timeouts para conexiones o backend
        proxy_connect_timeout 30s;  # Tempo máximo para conectar
        proxy_send_timeout 90s;     # Tempo máximo para enviar datos
        proxy_read_timeout 90s;     # Tempo máximo para recibir resposta
    }
 



    # ===== UBICACIÓN SECUNDARIA: ARCHIVOS STATIC =====
    # Sirve assets/js/css directamente desde Nginx sin pasar polo backend, funciona como un LiveServer

        #si este dabaixo non funciona probar o da linea 66       
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;                 # Cachea durante 1 ano
        add_header Cache-Control "public, immutable";  # Non cambian nunca
    }
    #location /assets/images/uploads/ {
    #alias /usr/share/nginx/html/static/assets/images/uploads/;
    #expires 1y;
    #add_header Cache-Control "public, immutable";

    location /js/ {
        alias /usr/share/nginx/html/js/;
        expires 1h;
        add_header Cache-Control "public";
    }
    location /css/ {
        alias /usr/share/nginx/html/css/;
        expires 1h;
        add_header Cache-Control "public";
    }


    # ===== UBICACIÓN PARA PÁXINAS ESPECÍFICAS =====
    location /static/assets/images/uploads/ {
    alias /usr/share/nginx/html/static/assets/images/uploads/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

    # Sirve solo os HTML desde static (live reload) poñemos estos para quef uncione o swagger e outros html
    location = /dashboard.html {
        root /usr/share/nginx/html;
        expires 1m;
        add_header Cache-Control "public";
    }
    location = /login.html {
        root /usr/share/nginx/html;
        expires 1m;
        add_header Cache-Control "public";
    }
    location = /mis-pedidos.html {
        root /usr/share/nginx/html;
        expires 1m;
        add_header Cache-Control "public";
    }
}


